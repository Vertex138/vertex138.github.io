<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jefferson</title>

<style>

html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
}

/*
 * Prevent transformed images from expanding the mobile page while
 * they slide beyond the viewport. Modern browsers can clip that
 * overflow without creating a horizontal scrolling container.
 */

@supports (overflow-x: clip) {
    html, body {
        overflow-x: clip;
    }
}

body {
    background: #E6D79E;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-y: hidden;

    transition: background-color 1s ease;
}

body.no-background-transition {
    transition: none;
}

#image-container {
    display: flex;
    flex-direction: column;
    align-items: center;

    max-width: 90vw;
    max-height: 90vh;
}

#random-image {
    display: block;
    max-width: 100%;
    max-height: calc(90vh - 6vh);
    object-fit: contain;
    cursor: pointer;
    user-select: none;
}

#image-id-tag {
    margin-top: 1vh;
    color: black;

    font-family: Arial, sans-serif;
    font-size: 5vh;
    font-weight: bold;
    line-height: 1;
    letter-spacing: 0.5px;

    user-select: none;
}

#random-image:not([src]),
#random-image[src=""] {
    visibility: hidden;
}

#random-image:not([src]) + #image-id-tag,
#random-image[src=""] + #image-id-tag {
    visibility: hidden;
}

#random-image.is-transitioning {
    pointer-events: none;
}

/*
 * Default slide animations.
 */

.slide-in {
    animation: slideIn 0.55s
        cubic-bezier(0.22, 0.8, 0.35, 1)
        forwards;
}

.slide-out {
    animation: slideOut 0.45s
        cubic-bezier(0.55, 0.05, 0.8, 0.35)
        forwards;
}

@keyframes slideIn {
    from {
        transform: translateX(110vw);
    }

    to {
        transform: translateX(0);
    }
}

@keyframes slideOut {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-110vw);
    }
}

/*
 * Reduced-motion image animations.
 */

.fade-in {
    animation: fadeIn 0.35s forwards;
}

.fade-out {
    animation: fadeOut 0.35s forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes fadeOut {
    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }
}

#gallery-button,
#clear-all-button,
#force-new-button {

    font-size: clamp(12px, 1.5vw, 18px);
    padding: 1vh 2vw;

    border: none;
    border-radius: 8px;

    background: rgba(0, 0, 0, 0.7);
    color: white;

    cursor: pointer;
    touch-action: manipulation;
}

#gallery-button {
    position: fixed;
    bottom: max(2vh, env(safe-area-inset-bottom, 0px));
    left: max(2vw, env(safe-area-inset-left, 0px));
    z-index: 100;
}

#image-history-controls {
    position: fixed;
    bottom: max(2vh, env(safe-area-inset-bottom, 0px));
    right: max(2vw, env(safe-area-inset-right, 0px));
    z-index: 100;

    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
}

#gallery-button:hover,
#clear-all-button:hover,
#force-new-button:not(:disabled):hover {
    background: rgba(0, 0, 0, 0.9);
}

#force-new-button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/*
 * Persistent completion marker.
 */

#collection-complete-star {
    position: fixed;
    top: max(2vh, env(safe-area-inset-top, 0px));
    right: max(2vw, env(safe-area-inset-right, 0px));
    z-index: 900;

    color: black;
    font-family: Arial, sans-serif;
    font-size: 5vh;
    line-height: 1;

    pointer-events: none;
    user-select: none;
}

/*
 * Full-screen completion and error states.
 */

[hidden] {
    display: none !important;
}

#collection-complete-overlay,
#error-overlay {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    box-sizing: border-box;
    padding: 24px;

    background: rgba(0, 0, 0, 0.62);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}

#collection-complete-overlay {
    z-index: 2000;
}

#error-overlay {
    z-index: 3000;
}

#collection-complete-card,
#error-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

#collection-complete-card {
    width: min(360px, calc(100vw - 48px));
    box-sizing: border-box;
    padding: 28px 24px 24px;
    border-radius: 20px;

    background: linear-gradient(
        135deg,
        #ffe680,
        #e6bc45
    );

    color: #272112;
    font-family: Arial, sans-serif;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
}

#collection-complete-symbol {
    margin-bottom: 8px;
    font-size: 48px;
    line-height: 1;
}

#collection-complete-title {
    margin: 0 0 20px;
    font-size: clamp(22px, 6vw, 32px);
    letter-spacing: 1px;
}

#collection-continue-button,
#retry-button {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;

    font: inherit;
    font-weight: bold;
    letter-spacing: 0.7px;

    cursor: pointer;
    touch-action: manipulation;
}

#collection-continue-button {
    background: rgba(39, 33, 18, 0.86);
    color: white;
}

#error-content {
    font-family: Arial, sans-serif;
    color: white;
}

#error-message {
    margin: 0 0 12px;
    font-size: clamp(13px, 3.5vw, 16px);
}

#retry-button {
    background: rgba(0, 0, 0, 0.78);
    color: white;
}

#collection-continue-button:hover,
#retry-button:hover {
    filter: brightness(1.15);
}

/*
 * Animated indicator for newly discovered images.
 */

#new-indicator {
    position: fixed;
    top: 2vh;
    right: 2vw;
    z-index: 1000;

    max-width: calc(100vw - 4vw);
    box-sizing: border-box;

    display: grid;
    grid-template-columns: auto auto;
    column-gap: 8px;
    row-gap: 2px;
    align-items: center;

    padding: 10px 18px;
    border-radius: 18px;

    background: linear-gradient(
        135deg,
        #ffe680,
        #e6bc45
    );

    color: #272112;
    font-family: Arial, sans-serif;

    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);

    opacity: 0;
    pointer-events: none;
    user-select: none;
}

#new-symbol {
    grid-column: 1;
    grid-row: 1;

    font-size: clamp(16px, 2vw, 22px);
    line-height: 1;
}

#new-label {
    grid-column: 2;
    grid-row: 1;

    font-size: clamp(14px, 2vw, 20px);
    font-weight: bold;
    letter-spacing: 1px;
    line-height: 1;
}

#new-counter {
    grid-column: 2;
    grid-row: 2;

    font-size: clamp(10px, 1.2vw, 13px);
    font-weight: normal;
    letter-spacing: 0.3px;
    text-align: center;

    opacity: 0.8;
}

#viewed-count {
    display: inline-block;
}

#new-indicator.show {
    animation: newIndicator 2.1s ease forwards;
}

#viewed-count.increment {
    animation: countIncrement 0.5s ease-out forwards;
}

@keyframes newIndicator {
    0% {
        opacity: 0;
        transform: translateY(-12px) scale(0.8);
    }

    15% {
        opacity: 1;
        transform: translateY(0) scale(1.08);
    }

    25% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    78% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    100% {
        opacity: 0;
        transform: translateY(-8px) scale(0.95);
    }
}

@keyframes countIncrement {
    0% {
        opacity: 0;
        transform: translateY(7px) scale(0.85);
    }

    55% {
        opacity: 1;
        transform: translateY(-2px) scale(1.18);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/*
 * Simplify the NEW! indicator animations when reduced
 * motion is enabled.
 */

@keyframes newIndicatorReduced {
    0% {
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    78% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

@keyframes countIncrementReduced {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@media (prefers-reduced-motion: reduce) {
    body {
        transition: none;
    }

    #new-indicator.show {
        animation: newIndicatorReduced 2.1s ease forwards;
    }

    #viewed-count.increment {
        animation: countIncrementReduced 0.5s ease forwards;
    }
}

</style>
</head>

<body>

<div id="image-container">
    <img
        id="random-image"
        alt="Randomly selected image"
        draggable="false"
    >

    <span id="image-id-tag" aria-live="polite"></span>
</div>

<div id="new-indicator" aria-hidden="true">
    <span id="new-symbol">★</span>

    <span id="new-label">NEW!</span>

    <span id="new-counter">
        <span id="viewed-count">0</span>
        /
        <span id="image-goal">150</span>
    </span>
</div>

<div
    id="collection-complete-star"
    role="img"
    aria-label="You've completed Jeff's gallery"
    title="You've completed Jeff's gallery"
    hidden
>
    ★
</div>

<div
    id="collection-complete-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="collection-complete-title"
    hidden
>
    <div id="collection-complete-card">
        <div id="collection-complete-symbol" aria-hidden="true">
            ★
        </div>

        <h1 id="collection-complete-title">
            You've Completed Jeff's Gallery!
        </h1>

        <button
            id="collection-continue-button"
            type="button"
        >
            Meow!
        </button>
    </div>
</div>

<div
    id="error-overlay"
    role="alert"
    aria-live="assertive"
    hidden
>
    <div id="error-content">
        <p id="error-message">
            Oops! Something went wrong. Maybe Jeff is feeling shy today?
        </p>

        <button
            id="retry-button"
            type="button"
        >
            RETRY
        </button>
    </div>
</div>

<button
    id="gallery-button"
    onclick="location.href='/gallery'"
>
    Gallery
</button>

<div id="image-history-controls">
    <button
        id="force-new-button"
        type="button"
        disabled
    >
        FORCE NEW
    </button>

    <button
        id="clear-all-button"
        type="button"
    >
        CLEAR ALL
    </button>
</div>

<script>

const RECENT_IMAGE_LIMIT = 10;
const TOTAL_IMAGE_GOAL = 150;

const NEW_IMAGE_GUARANTEE_INTERVAL = 3;
const NEW_IMAGE_GUARANTEE_STEP = 0.05;

const IMAGE_DIRECTORY = "images/";

const RECENT_IMAGES_KEY = "recentImages";
const VIEWED_IMAGES_KEY = "viewedImages";
const NO_NEW_STREAK_KEY = "noNewImageStreak";
const COLLECTION_COMPLETE_ACKNOWLEDGED_KEY =
    "collectionCompleteAcknowledged";

const reducedMotionQuery = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
);

let imageMap = {};
let availableImageIds = [];

let transitionInProgress = false;
let countAnimationTimeout = null;
let pendingRetryAction = null;

/*
 * Determine whether reduced motion is currently enabled.
 */

function reducedMotionEnabled() {
    return reducedMotionQuery.matches;
}

/*
 * Verify that an image ID falls within the complete image collection.
 */

function isValidImageId(value) {
    return (
        Number.isInteger(value) &&
        value >= 1 &&
        value <= TOTAL_IMAGE_GOAL
    );
}

/*
 * Retrieve numerical image IDs from localStorage.
 */

function getStoredImageIds(key) {
    try {
        const savedValues = localStorage.getItem(key);

        if (!savedValues) {
            return [];
        }

        const parsedValues = JSON.parse(savedValues);

        if (!Array.isArray(parsedValues)) {
            return [];
        }

        return parsedValues.filter(isValidImageId);

    } catch (error) {
        console.warn(
            `Could not retrieve "${key}" from localStorage:`,
            error
        );

        return [];
    }
}

/*
 * Save numerical image IDs to localStorage.
 */

function saveStoredImageIds(key, ids) {
    try {
        localStorage.setItem(
            key,
            JSON.stringify(ids)
        );

    } catch (error) {
        console.warn(
            `Could not save "${key}" to localStorage:`,
            error
        );
    }
}

/*
 * Retrieve the number of consecutive previously viewed images
 * displayed since the visitor last discovered a new image.
 */

function getNoNewImageStreak() {
    try {
        const savedValue = Number(
            localStorage.getItem(NO_NEW_STREAK_KEY)
        );

        if (
            !Number.isInteger(savedValue) ||
            savedValue < 0
        ) {
            return 0;
        }

        return savedValue;

    } catch (error) {
        console.warn(
            "Could not retrieve the no-NEW image streak:",
            error
        );

        return 0;
    }
}

/*
 * Save the current no-NEW image streak.
 */

function saveNoNewImageStreak(streak) {
    try {
        localStorage.setItem(
            NO_NEW_STREAK_KEY,
            String(streak)
        );

    } catch (error) {
        console.warn(
            "Could not save the no-NEW image streak:",
            error
        );
    }
}

/*
 * Retrieve the most recently displayed image IDs.
 */

function getRecentImageIds() {
    return getStoredImageIds(RECENT_IMAGES_KEY)
        .slice(-RECENT_IMAGE_LIMIT);
}

/*
 * Retrieve every unique image ID the visitor has viewed.
 */

function getViewedImageIds() {
    return [
        ...new Set(
            getStoredImageIds(VIEWED_IMAGES_KEY)
        )
    ];
}

/*
 * Add an image ID to the recent history.
 */

function rememberRecentImage(imageId) {
    let recentIds = getRecentImageIds();

    recentIds = recentIds.filter(
        savedId => savedId !== imageId
    );

    recentIds.push(imageId);

    saveStoredImageIds(
        RECENT_IMAGES_KEY,
        recentIds.slice(-RECENT_IMAGE_LIMIT)
    );
}

/*
 * Add an image ID to the complete viewing history only if
 * it has not previously been viewed.
 */

function rememberViewedImage(imageId) {
    const viewedIds = getViewedImageIds();

    if (viewedIds.includes(imageId)) {
        return {
            isNew: false,
            viewedCount: viewedIds.length
        };
    }

    viewedIds.push(imageId);

    saveStoredImageIds(
        VIEWED_IMAGES_KEY,
        viewedIds
    );

    return {
        isNew: true,
        viewedCount: viewedIds.length
    };
}

/*
 * Retrieve valid numerical IDs from images.json.
 */

function getAvailableImageIds(imageData) {
    return Object.entries(imageData)
        .filter(([rawId, filename]) => {
            const imageId = Number(rawId);

            return (
                isValidImageId(imageId) &&
                typeof filename === "string" &&
                filename.trim() !== ""
            );
        })
        .map(
            ([rawId]) => Number(rawId)
        );
}

/*
 * Choose a random image ID while excluding recent IDs.
 */

function chooseRandomImageId() {
    let recentIds = getRecentImageIds().filter(
        imageId => availableImageIds.includes(imageId)
    );

    /*
     * Always leave at least one image available.
     */

    const maximumExclusions = Math.min(
        RECENT_IMAGE_LIMIT,
        Math.max(
            availableImageIds.length - 1,
            0
        )
    );

    if (maximumExclusions > 0) {
        recentIds = recentIds.slice(
            -maximumExclusions
        );

    } else {
        recentIds = [];
    }

    const possibleIds = availableImageIds.filter(
        imageId => !recentIds.includes(imageId)
    );

    return possibleIds[
        Math.floor(
            Math.random() * possibleIds.length
        )
    ];
}

/*
 * Retrieve every image ID the visitor has not yet viewed.
 */

function getUnseenImageIds() {
    const viewedIds = new Set(
        getViewedImageIds()
    );

    return availableImageIds.filter(
        imageId => !viewedIds.has(imageId)
    );
}

/*
 * Calculate the chance of guaranteeing a new image.
 *
 * 3 images without a NEW image = 5%
 * 6 images without a NEW image = 10%
 * 9 images without a NEW image = 15%
 */

function getNewImageGuaranteeChance() {
    const completedIntervals = Math.floor(
        getNoNewImageStreak() /
        NEW_IMAGE_GUARANTEE_INTERVAL
    );

    return Math.min(
        completedIntervals * NEW_IMAGE_GUARANTEE_STEP,
        1
    );
}

/*
 * Choose the next image. FORCE NEW bypasses the probability roll,
 * but neither path can select a new image after all images have
 * already been discovered.
 */

function chooseNextImageSelection(forceNew = false) {
    const unseenIds = getUnseenImageIds();

    if (unseenIds.length > 0) {
        const guaranteeChance = getNewImageGuaranteeChance();

        if (
            forceNew ||
            Math.random() < guaranteeChance
        ) {
            return {
                imageId: unseenIds[
                    Math.floor(
                        Math.random() * unseenIds.length
                    )
                ],
                wasGuaranteed: true
            };
        }
    }

    return {
        imageId: chooseRandomImageId(),
        wasGuaranteed: false
    };
}

/*
 * Disable FORCE NEW when no undiscovered images remain.
 */

function updateForceNewButtonState() {
    const button = document.getElementById(
        "force-new-button"
    );

    const allImagesViewed = (
        availableImageIds.length > 0 &&
        getUnseenImageIds().length === 0
    );

    button.disabled = (
        availableImageIds.length === 0 ||
        allImagesViewed
    );

    button.title = allImagesViewed
        ? "All images have already been discovered."
        : "Display an image you have not viewed before.";
}

/*
 * Display the current numerical image ID using three digits.
 */

function updateDisplayedImageId(imageId) {
    const tag = document.getElementById(
        "image-id-tag"
    );

    tag.textContent = `#${String(imageId).padStart(3, "0")}`;
}

/*
 * Determine whether every available image has been discovered.
 */

function collectionIsComplete() {
    return (
        availableImageIds.length > 0 &&
        getUnseenImageIds().length === 0
    );
}

/*
 * Retrieve whether the completion overlay has been acknowledged.
 */

function collectionCompletionWasAcknowledged() {
    try {
        return localStorage.getItem(
            COLLECTION_COMPLETE_ACKNOWLEDGED_KEY
        ) === "true";

    } catch (error) {
        console.warn(
            "Could not retrieve the collection-complete state:",
            error
        );

        return false;
    }
}

/*
 * Save whether the completion overlay has been acknowledged.
 */

function saveCollectionCompletionAcknowledged(
    acknowledged
) {
    try {
        if (acknowledged) {
            localStorage.setItem(
                COLLECTION_COMPLETE_ACKNOWLEDGED_KEY,
                "true"
            );

        } else {
            localStorage.removeItem(
                COLLECTION_COMPLETE_ACKNOWLEDGED_KEY
            );
        }

    } catch (error) {
        console.warn(
            "Could not save the collection-complete state:",
            error
        );
    }
}

/*
 * Synchronize the completion overlay and persistent star with the
 * visitor's current collection progress.
 */

function updateCollectionCompleteState() {
    const overlay = document.getElementById(
        "collection-complete-overlay"
    );

    const star = document.getElementById(
        "collection-complete-star"
    );

    if (!collectionIsComplete()) {
        star.hidden = true;
        overlay.hidden = true;

        saveCollectionCompletionAcknowledged(false);
        return;
    }

    star.hidden = false;

    if (!collectionCompletionWasAcknowledged()) {
        overlay.hidden = false;

        requestAnimationFrame(() => {
            document.getElementById(
                "collection-continue-button"
            ).focus();
        });
    }
}

/*
 * Dismiss the collection-complete overlay while retaining its star.
 */

function dismissCollectionCompleteOverlay() {
    saveCollectionCompletionAcknowledged(true);

    document.getElementById(
        "collection-complete-overlay"
    ).hidden = true;

    document.getElementById(
        "random-image"
    ).focus();
}

/*
 * Display or hide the recoverable error state.
 */

function showErrorState(retryAction) {
    pendingRetryAction = retryAction;

    document.getElementById(
        "error-overlay"
    ).hidden = false;

    requestAnimationFrame(() => {
        document.getElementById(
            "retry-button"
        ).focus();
    });
}

function hideErrorState() {
    document.getElementById(
        "error-overlay"
    ).hidden = true;
}

/*
 * Repeat the last operation that failed.
 */

async function retryLastFailedAction() {
    const retryAction = pendingRetryAction;

    pendingRetryAction = null;
    hideErrorState();

    if (retryAction) {
        await retryAction();
    }
}

/*
 * Convert an HSV color into an RGB CSS color.
 *
 * Hue:        0 through 359
 * Saturation: 0 through 1
 * Value:      0 through 1
 */

function hsvToRgb(hue, saturation, value) {
    const chroma = value * saturation;

    const hueSection = hue / 60;

    const intermediate = chroma * (
        1 - Math.abs(
            hueSection % 2 - 1
        )
    );

    const minimum = value - chroma;

    let red = 0;
    let green = 0;
    let blue = 0;

    if (hueSection < 1) {
        red = chroma;
        green = intermediate;

    } else if (hueSection < 2) {
        red = intermediate;
        green = chroma;

    } else if (hueSection < 3) {
        green = chroma;
        blue = intermediate;

    } else if (hueSection < 4) {
        green = intermediate;
        blue = chroma;

    } else if (hueSection < 5) {
        red = intermediate;
        blue = chroma;

    } else {
        red = chroma;
        blue = intermediate;
    }

    red = Math.round(
        (red + minimum) * 255
    );

    green = Math.round(
        (green + minimum) * 255
    );

    blue = Math.round(
        (blue + minimum) * 255
    );

    return `rgb(${red}, ${green}, ${blue})`;
}

/*
 * Set a random background using:
 *
 * Hue:        random
 * Saturation: 30%
 * Value:      90%
 */

function setRandomBackground(animate = true) {
    const body = document.body;

    const randomHue = Math.floor(
        Math.random() * 360
    );

    const backgroundColor = hsvToRgb(
        randomHue,
        0.30,
        0.90
    );

    if (!animate) {
        body.classList.add(
            "no-background-transition"
        );
    }

    body.style.backgroundColor = backgroundColor;

    if (!animate) {
        /*
         * Allow future background changes to transition normally.
         */

        void body.offsetWidth;

        requestAnimationFrame(() => {
            body.classList.remove(
                "no-background-transition"
            );
        });
    }
}

/*
 * Remove all image-animation classes.
 */

function clearImageAnimationClasses(element) {
    element.classList.remove(
        "slide-in",
        "slide-out",
        "fade-in",
        "fade-out"
    );
}

/*
 * Play an image animation and wait for it to finish.
 */

function playImageAnimation(
    element,
    animationClass,
    expectedDuration
) {
    clearImageAnimationClasses(element);

    return new Promise(resolve => {
        let finished = false;
        let fallbackTimer = null;

        const finish = () => {
            if (finished) {
                return;
            }

            finished = true;

            if (fallbackTimer !== null) {
                clearTimeout(fallbackTimer);
            }

            element.removeEventListener(
                "animationend",
                handleAnimationEnd
            );

            resolve();
        };

        const handleAnimationEnd = event => {
            if (event.target === element) {
                finish();
            }
        };

        element.addEventListener(
            "animationend",
            handleAnimationEnd
        );

        element.classList.add(animationClass);

        fallbackTimer = setTimeout(
            finish,
            expectedDuration + 200
        );
    });
}

/*
 * Preload one image.
 *
 * Only one temporary Image object exists during a transition.
 */

function preloadImage(source) {
    return new Promise((resolve, reject) => {
        const preloader = new Image();

        preloader.onload = () => {
            resolve(preloader);
        };

        preloader.onerror = () => {
            preloader.removeAttribute("src");

            reject(
                new Error(
                    `Could not preload image: ${source}`
                )
            );
        };

        preloader.src = source;
    });
}

/*
 * Assign a preloaded image to the visible image element.
 */

function applyPreloadedImage(img, preloader) {
    return new Promise((resolve, reject) => {
        let finished = false;

        const source = preloader.src;

        const finish = callback => {
            if (finished) {
                return;
            }

            finished = true;

            img.onload = null;
            img.onerror = null;

            callback();
        };

        img.onload = () => {
            finish(resolve);
        };

        img.onerror = () => {
            finish(() => {
                reject(
                    new Error(
                        `Could not display image: ${source}`
                    )
                );
            });
        };

        img.src = source;

        /*
         * Handle images that are immediately available from cache.
         */

        if (
            img.complete &&
            img.naturalWidth > 0
        ) {
            queueMicrotask(() => {
                finish(resolve);
            });
        }
    });
}

/*
 * Release the temporary preloader reference.
 *
 * The visible image retains its own reference to the current image.
 */

function releasePreloader(preloader) {
    if (!preloader) {
        return;
    }

    preloader.onload = null;
    preloader.onerror = null;
    preloader.removeAttribute("src");
}

/*
 * Show the animated NEW! indicator.
 */

function showNewIndicator(
    viewedCount,
    wasGuaranteed = false
) {
    const indicator = document.getElementById(
        "new-indicator"
    );

    const symbol = document.getElementById(
        "new-symbol"
    );

    const count = document.getElementById(
        "viewed-count"
    );

    const goal = document.getElementById(
        "image-goal"
    );

    clearTimeout(countAnimationTimeout);

    symbol.textContent = wasGuaranteed
        ? "☆"
        : "★";

    goal.textContent = TOTAL_IMAGE_GOAL;

    count.textContent = Math.max(
        viewedCount - 1,
        0
    );

    indicator.classList.remove("show");
    count.classList.remove("increment");

    /*
     * Force both animations to restart.
     */

    void indicator.offsetWidth;

    indicator.setAttribute(
        "aria-hidden",
        "false"
    );

    indicator.classList.add("show");

    countAnimationTimeout = setTimeout(() => {
        count.textContent = viewedCount;
        count.classList.add("increment");
    }, 220);
}

document.getElementById("new-indicator").addEventListener(
    "animationend",
    function (event) {
        if (event.target !== this) {
            return;
        }

        this.classList.remove("show");

        this.setAttribute(
            "aria-hidden",
            "true"
        );
    }
);

/*
 * Record a successfully displayed image.
 */

function recordDisplayedImage(
    imageId,
    wasGuaranteed = false
) {
    updateDisplayedImageId(imageId);
    rememberRecentImage(imageId);

    const viewingResult = rememberViewedImage(
        imageId
    );

    if (viewingResult.isNew) {
        saveNoNewImageStreak(0);

        showNewIndicator(
            viewingResult.viewedCount,
            wasGuaranteed
        );

    } else {
        saveNoNewImageStreak(
            getNoNewImageStreak() + 1
        );
    }

    updateForceNewButtonState();
    updateCollectionCompleteState();
}

/*
 * Display the first image when the page opens.
 */

async function displayInitialImage() {
    const img = document.getElementById(
        "random-image"
    );

    const imageContainer = document.getElementById(
        "image-container"
    );

    const selection = chooseNextImageSelection();
    const imageId = selection.imageId;
    const filename = imageMap[imageId];
    const source = IMAGE_DIRECTORY + filename;

    let preloader = null;

    transitionInProgress = true;

    img.classList.add("is-transitioning");

    try {
        preloader = await preloadImage(source);

        await applyPreloadedImage(
            img,
            preloader
        );

        recordDisplayedImage(
            imageId,
            selection.wasGuaranteed
        );

        const incomingAnimation = reducedMotionEnabled()
            ? "fade-in"
            : "slide-in";

        const incomingDuration = reducedMotionEnabled()
            ? 350
            : 550;

        await playImageAnimation(
            imageContainer,
            incomingAnimation,
            incomingDuration
        );

    } finally {
        releasePreloader(preloader);

        img.classList.remove("is-transitioning");

        transitionInProgress = false;
    }
}

/*
 * Replace the current image without reloading the page.
 */

async function displayNextImage(
    forceNew = false,
    retrySelection = null
) {
    if (transitionInProgress) {
        return;
    }

    const img = document.getElementById(
        "random-image"
    );

    const imageContainer = document.getElementById(
        "image-container"
    );

    const selection = retrySelection ||
        chooseNextImageSelection(forceNew);

    const imageId = selection.imageId;
    const filename = imageMap[imageId];
    const source = IMAGE_DIRECTORY + filename;

    let preloader = null;

    transitionInProgress = true;

    img.classList.add("is-transitioning");

    try {
        const useReducedMotion = reducedMotionEnabled();

        /*
         * Begin transitioning the background immediately,
         * unless reduced motion is enabled.
         */

        if (!useReducedMotion) {
            setRandomBackground(true);
        }

        /*
         * Move or fade the current image off-screen first.
         */

        const outgoingAnimation = useReducedMotion
            ? "fade-out"
            : "slide-out";

        const outgoingDuration = useReducedMotion
            ? 350
            : 450;

        await playImageAnimation(
            imageContainer,
            outgoingAnimation,
            outgoingDuration
        );

        /*
         * Load the next image after the current image
         * has finished moving off-screen.
         */

        preloader = await preloadImage(source);

        /*
         * Replace the previous image once its replacement
         * has finished loading.
         */

        img.removeAttribute("src");

        await applyPreloadedImage(
            img,
            preloader
        );

        recordDisplayedImage(
            imageId,
            selection.wasGuaranteed
        );

        /*
         * Move or fade the new image onto the screen.
         */

        const incomingAnimation = useReducedMotion
            ? "fade-in"
            : "slide-in";

        const incomingDuration = useReducedMotion
            ? 350
            : 550;

        await playImageAnimation(
            imageContainer,
            incomingAnimation,
            incomingDuration
        );

        pendingRetryAction = null;

    } catch (error) {
        console.error(error);

        /*
         * If the next image fails to load, removing the
         * animation class restores the previous image.
         */

        clearImageAnimationClasses(imageContainer);

        showErrorState(
            () => displayNextImage(
                forceNew,
                selection
            )
        );

    } finally {
        releasePreloader(preloader);

        img.classList.remove("is-transitioning");

        transitionInProgress = false;
    }
}

/*
 * Load images.json once when the page opens.
 */

async function initializePage() {
    /*
     * The initial random background is assigned on every complete
     * page load, including in reduced-motion mode.
     */

    setRandomBackground(false);

    try {
        const response = await fetch("images.json");

        if (!response.ok) {
            throw new Error(
                `Could not load images.json: ${response.status}`
            );
        }

        imageMap = await response.json();

        if (
            imageMap === null ||
            typeof imageMap !== "object" ||
            Array.isArray(imageMap)
        ) {
            throw new Error(
                "images.json must map numerical IDs to filenames."
            );
        }

        availableImageIds = getAvailableImageIds(
            imageMap
        );

        if (availableImageIds.length === 0) {
            throw new Error(
                "images.json does not contain any valid image IDs."
            );
        }

        updateForceNewButtonState();

        await displayInitialImage();

        pendingRetryAction = null;

    } catch (error) {
        console.error(error);

        showErrorState(
            () => initializePage()
        );
    }
}

/*
 * Request another image without reloading the page.
 */

document.getElementById("random-image").addEventListener(
    "click",
    () => displayNextImage(false)
);

/*
 * Clear both saved image histories after confirmation.
 */

function clearAllSavedImageHistory() {
    const confirmed = window.confirm(
        "Are you sure you want to clear all saved image history?"
    );

    if (!confirmed) {
        return;
    }

    try {
        localStorage.removeItem(
            RECENT_IMAGES_KEY
        );

        localStorage.removeItem(
            VIEWED_IMAGES_KEY
        );

        localStorage.removeItem(
            NO_NEW_STREAK_KEY
        );

        localStorage.removeItem(
            COLLECTION_COMPLETE_ACKNOWLEDGED_KEY
        );

        updateForceNewButtonState();
        updateCollectionCompleteState();

        window.alert(
            "All saved image history has been cleared."
        );

    } catch (error) {
        console.error(
            "Could not clear the saved image history:",
            error
        );

        window.alert(
            "The saved image history could not be cleared."
        );
    }
}

/*
 * Press Delete to clear both saved image histories on desktop.
 */

document.addEventListener("keydown", event => {
    if (
        event.key !== "Delete" ||
        event.repeat
    ) {
        return;
    }

    clearAllSavedImageHistory();
});

/*
 * Provide the same clearing control on mobile and touch devices.
 */

document.getElementById("clear-all-button").addEventListener(
    "click",
    clearAllSavedImageHistory
);

/*
 * Guarantee an undiscovered image when at least one remains.
 */

document.getElementById("force-new-button").addEventListener(
    "click",
    () => displayNextImage(true)
);

/*
 * Dismiss the completed-collection overlay.
 */

document.getElementById(
    "collection-continue-button"
).addEventListener(
    "click",
    dismissCollectionCompleteOverlay
);

/*
 * Retry the last failed loading operation.
 */

document.getElementById("retry-button").addEventListener(
    "click",
    retryLastFailedAction
);

initializePage();

</script>

</html>
