<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Jefferson</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">

<link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="icons/favicon-32x32.png"
>

<link
    rel="apple-touch-icon"
    sizes="180x180"
    href="icons/apple-touch-icon.png"
>

<link
    rel="preload"
    href="fonts/MatchaMint.woff2"
    as="font"
    type="font/woff2"
    crossorigin
>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="image-container">
    <img
        id="random-image"
        alt="Randomly selected image"
        draggable="false"
    >

    <span id="image-id-tag" aria-live="polite"></span>
</div>

<div id="new-indicator" aria-hidden="true">
    <span id="new-symbol">★</span>

    <span id="new-label">NEW!</span>

    <span id="new-counter">
        <span id="viewed-count">0</span>
        /
        <span id="image-goal">150</span>
    </span>
</div>

<div
    id="collection-complete-star"
    role="img"
    aria-label="You've completed Jeff's gallery"
    title="You've completed Jeff's gallery"
    hidden
>
    ★
</div>

<div
    id="collection-complete-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="collection-complete-title"
    hidden
>
    <div id="collection-complete-card">
        <div id="collection-complete-symbol" aria-hidden="true">
            ★
        </div>

        <h1 id="collection-complete-title">
            You've Completed Jeff's Gallery!
        </h1>

        <button
            id="collection-continue-button"
            type="button"
        >
            Meow!
        </button>
    </div>
</div>

<div
    id="error-overlay"
    role="alert"
    aria-live="assertive"
    hidden
>
    <div id="error-content">
        <p id="error-message">
            Oops! Something went wrong. Maybe Jeff is feeling shy today?
        </p>

        <button
            id="retry-button"
            type="button"
        >
            RETRY
        </button>
    </div>
</div>

<button
    id="gallery-button"
    onclick="location.href='/gallery'"
>
    Gallery
</button>

<div id="image-history-controls">
    <button
        id="force-new-button"
        type="button"
        disabled
    >
        FORCE NEW
    </button>

    <button
        id="clear-all-button"
        type="button"
    >
        CLEAR ALL
    </button>
</div>

<script src="app.js"></script>

</body>
</html>
