<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Text Generator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #1e1e1e;
  color: #fff;
  margin: 0;
  padding: 10px;
  display: flex;
  justify-content: center;
}

.container {
  background: #2a2a2a;
  padding: 16px;
  border-radius: 12px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

input, textarea, select, button {
  width: 100%;
  margin: 8px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
  box-sizing: border-box;
  font-size: 1rem;
}

button.secondary { background: #3a7bd5; }

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* ✅ FIX: keep side-by-side even on mobile */
@media (max-width: 500px) {
  .row {
    grid-template-columns: 1fr 80px;
  }
}

input[type="color"] {
  height: 45px;
  padding: 0;
}

pre {
  background: #111;
  padding: 10px;
  border-radius: 6px;
  max-height: 140px;
  overflow: auto;
}

.preview {
  background: #000;
  padding: 10px;
  border-radius: 6px;
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">

<h2>Colorful Text Generator</h2>
<h3>Intended for use in <i>Last Asylum: Plague.</i></h3>

<label>Primary Color (col1)</label>
<div class="row">
  <input id="col1">
  <input id="col1picker" type="color" value="#ffffff">
</div>

<label>Secondary Color (col2)</label>
<div class="row">
  <input id="col2">
  <input id="col2picker" type="color" value="#000000">
</div>

<label>Text</label>
<textarea id="text"></textarea>

<label>Color Pattern</label>
<select id="pattern">
  <option value="primary">Primary Color (col1)</option>
  <option value="secondary">Secondary Color (col2)</option>
  <option value="forward">Forward Gradient (col1 → col2)</option>
  <option value="reverse">Reverse Gradient (col2 → col1)</option>
  <option value="mirror">Mirror Gradient (col1 → col2 → col1)</option>
  <option value="reverseMirror">Alt. Mirror Gradient (col2 → col1 → col2)</option>
</select>

<label>Footer</label>
<select id="footerMode">
  <option value="false">None</option>
  <option value="true">Default</option>
  <option value="custom">Custom</option>
</select>

<div id="footerCustom" class="row" style="display:none;">
  <input id="footerValue">
  <input id="footerPicker" type="color" value="#405572">
</div>

<div class="row">
  <button class="secondary" onclick="copyOutput()">Copy</button>
</div>

<h3>Output:</h3>
<pre id="output"></pre>

<h3>Live Preview <b>*</b>:</h3>
<div id="preview" class="preview"></div>
<div class="hint"><b>*</b><i> Will not display changes to alpha.</i></div>

</div>

<script>
function normalizeHex(hex) {
  hex = (hex || '').toLowerCase().replace(/#/g, '').trim();
  if (hex.length === 6) return hex + 'ff';
  if (hex.length === 8) return hex;
  throw new Error('invalid');
}

function tryNormalize(hex) {
  hex = (hex || '').toLowerCase().replace(/#/g, '').trim();

  if (hex.length === 6) return hex + 'ff';
  if (hex.length === 8) return hex;

  return null;
}

function hexToRgba(hex) {
  return hex.match(/.{2}/g).map(x => parseInt(x,16));
}

function rgbaToHex(rgba) {
  return rgba.map(v => v.toString(16).padStart(2,'0')).join('');
}

function hexToPicker(hex) {
  const n = tryNormalize(hex);
  return n ? '#' + n.substring(0,6) : null;
}

function syncTextToPicker(textId, pickerId) {
  const val = document.getElementById(textId).value;
  const p = hexToPicker(val);
  if (p) document.getElementById(pickerId).value = p;
}

function syncPickerToText(pickerId, textId) {
  const val = document.getElementById(pickerId).value;
  document.getElementById(textId).value = val.replace('#','') + 'ff';
}

function updateFooterState() {
  const mode = document.getElementById('footerMode').value;
  document.getElementById('footerCustom').style.display =
    (mode === 'custom') ? 'grid' : 'none';
}

syncTextToPicker('footerValue', 'footerPicker');

document.getElementById('footerMode').addEventListener('input', updateFooterState);
updateFooterState();

document.getElementById('footerValue').addEventListener('input', () => {
  syncTextToPicker('footerValue', 'footerPicker');
  generate();
});

document.getElementById('footerPicker').addEventListener('input', () => {
  syncPickerToText('footerPicker', 'footerValue');
  generate();
});

function generate() {
  try {
    const pattern = document.getElementById('pattern').value;
    const text = document.getElementById('text').value;

    let errors = [];

    let col1 = tryNormalize(document.getElementById('col1').value);
    let col2 = tryNormalize(document.getElementById('col2').value);

    // ✅ Only validate what's needed
    if (pattern === 'primary' && !col1) errors.push('col1');
    if (pattern === 'secondary' && !col2) errors.push('col2');
    if (!['primary','secondary'].includes(pattern)) {
      if (!col1) errors.push('col1');
      if (!col2) errors.push('col2');
    }

    let footerMode = document.getElementById('footerMode').value;
    let footer = null;

    if (footerMode === 'custom') {
      footer = tryNormalize(document.getElementById('footerValue').value);
      if (!footer) errors.push('footer');
    }

    if (errors.length) {
      throw new Error("Invalid: " + errors.join(', '));
    }

    let result = '';
    let preview = '';

    if (pattern === 'primary' || pattern === 'secondary') {
      let chosen = (pattern === 'primary') ? col1 : col2;
      result = `[${chosen}]${text}`;
      preview = `<span style="color: rgb(${hexToRgba(chosen).slice(0,3)})">${text}</span>`;
    } else {
      let start = hexToRgba(col1);
      let end = hexToRgba(col2);

      let chars = text.replace(/ /g,'').length;
      let index = 0;

      for (let c of text) {
        if (c === ' ') { result+=' '; preview+=' '; continue; }

        let base = chars <=1 ? 0 : index/(chars-1);

        let t =
          pattern==='forward'?base:
          pattern==='reverse'?1-base:
          pattern==='mirror'?(base<=0.5?base*2:(1-base)*2):
          (1-(base<=0.5?base*2:(1-base)*2));

        let rgba = start.map((v,i)=>Math.round(v+(end[i]-v)*t));
        let hex = rgbaToHex(rgba);

        result += `[${hex}]${c}`;
        preview += `<span style="color: rgb(${rgba.slice(0,3)})">${c}</span>`;
        index++;
      }
    }

    if (footerMode === 'true') result += '[405572ff]';
    if (footerMode === 'custom') result += `[${footer}]`;

    document.getElementById('output').textContent = result;
    document.getElementById('preview').innerHTML = preview;

  } catch (err) {
    document.getElementById('output').textContent = err.message;
    document.getElementById('preview').innerHTML = '';
  }
}

async function copyOutput() {
  const text = document.getElementById('output').textContent;
  if (!text) return;
  await navigator.clipboard.writeText(text);
}

// Sync listeners
['col1','col2','footerValue'].forEach(id=>{
  document.getElementById(id).addEventListener('input',generate);
});

document.getElementById('col1').addEventListener('input',()=>syncTextToPicker('col1','col1picker'));
document.getElementById('col2').addEventListener('input',()=>syncTextToPicker('col2','col2picker'));

document.getElementById('col1picker').addEventListener('input',()=>syncPickerToText('col1picker','col1'));
document.getElementById('col2picker').addEventListener('input',()=>syncPickerToText('col2picker','col2'));
document.getElementById('footerPicker').addEventListener('input',()=>syncPickerToText('footerPicker','footerValue'));

['text','pattern','footerMode'].forEach(id=>{
  document.getElementById(id).addEventListener('input',generate);
});
</script>
</body>
</html>
