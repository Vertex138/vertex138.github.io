<!doctype html>
<html lang="en" class="thanks-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thank you! — Meet Jeff</title>
  <style>html.thanks-pending { visibility: hidden; }</style>
  <script src="/jeff/thanks/thanks.js"></script>
  <link rel="icon" href="/jeff/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/jeff/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/jeff/icons/apple-touch-icon.png">
  <link rel="preload" href="/jeff/fonts/SuperBouncer.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/jeff/menu/site-menu.css">
  <link rel="stylesheet" href="/jeff/thanks/thanks.css">
  <script src="/jeff/menu/site-menu.js" defer></script>
  <noscript><style>html.thanks-pending { visibility: visible; } #thanks-page { display: none; }</style></noscript>
</head>
<body>
  <noscript><p>Please enable JavaScript to watch Jeff's movie. <a href="/jeff/">Meet Jeff</a></p></noscript>
  <main id="thanks-page" aria-label="A thank-you from Jeff">
    <div id="thanks-player">
      <div id="thanks-video-area">
        <video id="thanks-video" controlslist="nodownload" playsinline preload="metadata" aria-label="Jeff's thank-you movie" aria-hidden="true">
          Your browser cannot play this video.
        </video>
        <button id="thanks-play" type="button" aria-label="Play Jeff's movie" hidden>PLAY</button>
      </div>
      <div id="thanks-after-video">
        <div id="thanks-message-area" hidden>
          <p id="thanks-music-credit" aria-hidden="true" hidden>“My Little One”, from “Melodramatic” ‧ Siamés (2024)</p>
          <p id="thanks-status" role="status" aria-live="polite"></p>
        </div>
      </div>
      <div id="thanks-error" role="alert" hidden>
        <p>Jeff's movie couldn't load. Let's try that again.</p>
        <button id="thanks-retry" type="button">RETRY</button>
      </div>
    </div>
    <a id="thanks-stats-link" href="/jeff/thanks/stats/" hidden>Your stats</a>
  </main>
</body>
</html>
