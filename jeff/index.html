<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jefferson</title>

<style>

html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
}

/*
 * Prevent transformed images from expanding the mobile page while
 * they slide beyond the viewport. Modern browsers can clip that
 * overflow without creating a horizontal scrolling container.
 */

@supports (overflow-x: clip) {
    html, body {
        overflow-x: clip;
    }
}

body {
    background: #E6D79E;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-y: hidden;

    transition: background-color 0.7s ease;
}

body.no-background-transition {
    transition: none;
}

#random-image {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
    cursor: pointer;
    user-select: none;
}

#random-image:not([src]),
#random-image[src=""] {
    visibility: hidden;
}

#random-image.is-transitioning {
    pointer-events: none;
}

/*
 * Default slide animations.
 */

.slide-in {
    animation: slideIn 0.55s
        cubic-bezier(0.22, 0.8, 0.35, 1)
        forwards;
}

.slide-out {
    animation: slideOut 0.45s
        cubic-bezier(0.55, 0.05, 0.8, 0.35)
        forwards;
}

@keyframes slideIn {
    from {
        transform: translateX(110vw);
    }

    to {
        transform: translateX(0);
    }
}

@keyframes slideOut {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-110vw);
    }
}

/*
 * Reduced-motion image animations.
 */

.fade-in {
    animation: fadeIn 0.35s forwards;
}

.fade-out {
    animation: fadeOut 0.35s forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes fadeOut {
    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }
}

#gallery-button,
#clear-all-button {
    position: fixed;
    bottom: max(2vh, env(safe-area-inset-bottom, 0px));
    z-index: 100;

    font-size: clamp(12px, 1.5vw, 18px);
    padding: 1vh 2vw;

    border: none;
    border-radius: 8px;

    background: rgba(0, 0, 0, 0.7);
    color: white;

    cursor: pointer;
    touch-action: manipulation;
}

#gallery-button {
    left: max(2vw, env(safe-area-inset-left, 0px));
}

#clear-all-button {
    right: max(2vw, env(safe-area-inset-right, 0px));
}

#gallery-button:hover,
#clear-all-button:hover {
    background: rgba(0, 0, 0, 0.9);
}

/*
 * Animated indicator for newly discovered images.
 */

#new-indicator {
    position: fixed;
    top: 2vh;
    right: 2vw;
    z-index: 1000;

    max-width: calc(100vw - 4vw);
    box-sizing: border-box;

    display: grid;
    grid-template-columns: auto auto;
    column-gap: 8px;
    row-gap: 2px;
    align-items: center;

    padding: 10px 18px;
    border-radius: 18px;

    background: linear-gradient(
        135deg,
        #ffe680,
        #e6bc45
    );

    color: #272112;
    font-family: Arial, sans-serif;

    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);

    opacity: 0;
    pointer-events: none;
    user-select: none;
}

#new-symbol {
    grid-column: 1;
    grid-row: 1;

    font-size: clamp(16px, 2vw, 22px);
    line-height: 1;
}

#new-label {
    grid-column: 2;
    grid-row: 1;

    font-size: clamp(14px, 2vw, 20px);
    font-weight: bold;
    letter-spacing: 1px;
    line-height: 1;
}

#new-counter {
    grid-column: 2;
    grid-row: 2;

    font-size: clamp(10px, 1.2vw, 13px);
    font-weight: normal;
    letter-spacing: 0.3px;
    text-align: center;

    opacity: 0.8;
}

#viewed-count {
    display: inline-block;
}

#new-indicator.show {
    animation: newIndicator 2.1s ease forwards;
}

#viewed-count.increment {
    animation: countIncrement 0.5s ease-out forwards;
}

@keyframes newIndicator {
    0% {
        opacity: 0;
        transform: translateY(-12px) scale(0.8);
    }

    15% {
        opacity: 1;
        transform: translateY(0) scale(1.08);
    }

    25% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    78% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    100% {
        opacity: 0;
        transform: translateY(-8px) scale(0.95);
    }
}

@keyframes countIncrement {
    0% {
        opacity: 0;
        transform: translateY(7px) scale(0.85);
    }

    55% {
        opacity: 1;
        transform: translateY(-2px) scale(1.18);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/*
 * Simplify the NEW! indicator animations when reduced
 * motion is enabled.
 */

@keyframes newIndicatorReduced {
    0% {
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    78% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

@keyframes countIncrementReduced {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@media (prefers-reduced-motion: reduce) {
    body {
        transition: none;
    }

    #new-indicator.show {
        animation: newIndicatorReduced 2.1s ease forwards;
    }

    #viewed-count.increment {
        animation: countIncrementReduced 0.5s ease forwards;
    }
}

</style>
</head>

<body>

<img
    id="random-image"
    alt="Randomly selected image"
    draggable="false"
>

<div id="new-indicator" aria-hidden="true">
    <span id="new-symbol">★</span>

    <span id="new-label">NEW!</span>

    <span id="new-counter">
        <span id="viewed-count">0</span>
        /
        <span id="image-goal">100</span>
    </span>
</div>

<button
    id="gallery-button"
    onclick="location.href='/gallery'"
>
    Gallery
</button>

<button
    id="clear-all-button"
    type="button"
>
    CLEAR ALL
</button>

<script>

const RECENT_IMAGE_LIMIT = 5;
const TOTAL_IMAGE_GOAL = 150;

const IMAGE_DIRECTORY = "images/";

const RECENT_IMAGES_KEY = "recentImages";
const VIEWED_IMAGES_KEY = "viewedImages";

const NEW_IMAGE_SYMBOLS = [
    "★",
    "♥︎",
    "◆"
];

const reducedMotionQuery = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
);

let imageMap = {};
let availableImageIds = [];

let transitionInProgress = false;
let countAnimationTimeout = null;

/*
 * Determine whether reduced motion is currently enabled.
 */

function reducedMotionEnabled() {
    return reducedMotionQuery.matches;
}

/*
 * Verify that an image ID falls between 1 and 100.
 */

function isValidImageId(value) {
    return (
        Number.isInteger(value) &&
        value >= 1 &&
        value <= TOTAL_IMAGE_GOAL
    );
}

/*
 * Retrieve numerical image IDs from localStorage.
 */

function getStoredImageIds(key) {
    try {
        const savedValues = localStorage.getItem(key);

        if (!savedValues) {
            return [];
        }

        const parsedValues = JSON.parse(savedValues);

        if (!Array.isArray(parsedValues)) {
            return [];
        }

        return parsedValues.filter(isValidImageId);

    } catch (error) {
        console.warn(
            `Could not retrieve "${key}" from localStorage:`,
            error
        );

        return [];
    }
}

/*
 * Save numerical image IDs to localStorage.
 */

function saveStoredImageIds(key, ids) {
    try {
        localStorage.setItem(
            key,
            JSON.stringify(ids)
        );

    } catch (error) {
        console.warn(
            `Could not save "${key}" to localStorage:`,
            error
        );
    }
}

/*
 * Retrieve the five most recently displayed image IDs.
 */

function getRecentImageIds() {
    return getStoredImageIds(RECENT_IMAGES_KEY)
        .slice(-RECENT_IMAGE_LIMIT);
}

/*
 * Retrieve every unique image ID the visitor has viewed.
 */

function getViewedImageIds() {
    return [
        ...new Set(
            getStoredImageIds(VIEWED_IMAGES_KEY)
        )
    ];
}

/*
 * Add an image ID to the recent history.
 */

function rememberRecentImage(imageId) {
    let recentIds = getRecentImageIds();

    recentIds = recentIds.filter(
        savedId => savedId !== imageId
    );

    recentIds.push(imageId);

    saveStoredImageIds(
        RECENT_IMAGES_KEY,
        recentIds.slice(-RECENT_IMAGE_LIMIT)
    );
}

/*
 * Add an image ID to the complete viewing history only if
 * it has not previously been viewed.
 */

function rememberViewedImage(imageId) {
    const viewedIds = getViewedImageIds();

    if (viewedIds.includes(imageId)) {
        return {
            isNew: false,
            viewedCount: viewedIds.length
        };
    }

    viewedIds.push(imageId);

    saveStoredImageIds(
        VIEWED_IMAGES_KEY,
        viewedIds
    );

    return {
        isNew: true,
        viewedCount: viewedIds.length
    };
}

/*
 * Retrieve valid numerical IDs from images.json.
 */

function getAvailableImageIds(imageData) {
    return Object.entries(imageData)
        .filter(([rawId, filename]) => {
            const imageId = Number(rawId);

            return (
                isValidImageId(imageId) &&
                typeof filename === "string" &&
                filename.trim() !== ""
            );
        })
        .map(
            ([rawId]) => Number(rawId)
        );
}

/*
 * Choose a random image ID while excluding recent IDs.
 */

function chooseRandomImageId() {
    let recentIds = getRecentImageIds().filter(
        imageId => availableImageIds.includes(imageId)
    );

    /*
     * Always leave at least one image available.
     */

    const maximumExclusions = Math.min(
        RECENT_IMAGE_LIMIT,
        Math.max(
            availableImageIds.length - 1,
            0
        )
    );

    if (maximumExclusions > 0) {
        recentIds = recentIds.slice(
            -maximumExclusions
        );

    } else {
        recentIds = [];
    }

    const possibleIds = availableImageIds.filter(
        imageId => !recentIds.includes(imageId)
    );

    return possibleIds[
        Math.floor(
            Math.random() * possibleIds.length
        )
    ];
}

/*
 * Convert an HSV color into an RGB CSS color.
 *
 * Hue:        0 through 359
 * Saturation: 0 through 1
 * Value:      0 through 1
 */

function hsvToRgb(hue, saturation, value) {
    const chroma = value * saturation;

    const hueSection = hue / 60;

    const intermediate = chroma * (
        1 - Math.abs(
            hueSection % 2 - 1
        )
    );

    const minimum = value - chroma;

    let red = 0;
    let green = 0;
    let blue = 0;

    if (hueSection < 1) {
        red = chroma;
        green = intermediate;

    } else if (hueSection < 2) {
        red = intermediate;
        green = chroma;

    } else if (hueSection < 3) {
        green = chroma;
        blue = intermediate;

    } else if (hueSection < 4) {
        green = intermediate;
        blue = chroma;

    } else if (hueSection < 5) {
        red = intermediate;
        blue = chroma;

    } else {
        red = chroma;
        blue = intermediate;
    }

    red = Math.round(
        (red + minimum) * 255
    );

    green = Math.round(
        (green + minimum) * 255
    );

    blue = Math.round(
        (blue + minimum) * 255
    );

    return `rgb(${red}, ${green}, ${blue})`;
}

/*
 * Set a random background using:
 *
 * Hue:        random
 * Saturation: 30%
 * Value:      90%
 */

function setRandomBackground(animate = true) {
    const body = document.body;

    const randomHue = Math.floor(
        Math.random() * 360
    );

    const backgroundColor = hsvToRgb(
        randomHue,
        0.30,
        0.90
    );

    if (!animate) {
        body.classList.add(
            "no-background-transition"
        );
    }

    body.style.backgroundColor = backgroundColor;

    if (!animate) {
        /*
         * Allow future background changes to transition normally.
         */

        void body.offsetWidth;

        requestAnimationFrame(() => {
            body.classList.remove(
                "no-background-transition"
            );
        });
    }
}

/*
 * Remove all image-animation classes.
 */

function clearImageAnimationClasses(img) {
    img.classList.remove(
        "slide-in",
        "slide-out",
        "fade-in",
        "fade-out"
    );
}

/*
 * Play an image animation and wait for it to finish.
 */

function playImageAnimation(
    img,
    animationClass,
    expectedDuration
) {
    clearImageAnimationClasses(img);

    return new Promise(resolve => {
        let finished = false;
        let fallbackTimer = null;

        const finish = () => {
            if (finished) {
                return;
            }

            finished = true;

            if (fallbackTimer !== null) {
                clearTimeout(fallbackTimer);
            }

            img.removeEventListener(
                "animationend",
                handleAnimationEnd
            );

            resolve();
        };

        const handleAnimationEnd = event => {
            if (event.target === img) {
                finish();
            }
        };

        img.addEventListener(
            "animationend",
            handleAnimationEnd
        );

        img.classList.add(animationClass);

        fallbackTimer = setTimeout(
            finish,
            expectedDuration + 200
        );
    });
}

/*
 * Preload one image.
 *
 * Only one temporary Image object exists during a transition.
 */

function preloadImage(source) {
    return new Promise((resolve, reject) => {
        const preloader = new Image();

        preloader.onload = () => {
            resolve(preloader);
        };

        preloader.onerror = () => {
            preloader.removeAttribute("src");

            reject(
                new Error(
                    `Could not preload image: ${source}`
                )
            );
        };

        preloader.src = source;
    });
}

/*
 * Assign a preloaded image to the visible image element.
 */

function applyPreloadedImage(img, preloader) {
    return new Promise((resolve, reject) => {
        let finished = false;

        const source = preloader.src;

        const finish = callback => {
            if (finished) {
                return;
            }

            finished = true;

            img.onload = null;
            img.onerror = null;

            callback();
        };

        img.onload = () => {
            finish(resolve);
        };

        img.onerror = () => {
            finish(() => {
                reject(
                    new Error(
                        `Could not display image: ${source}`
                    )
                );
            });
        };

        img.src = source;

        /*
         * Handle images that are immediately available from cache.
         */

        if (
            img.complete &&
            img.naturalWidth > 0
        ) {
            queueMicrotask(() => {
                finish(resolve);
            });
        }
    });
}

/*
 * Release the temporary preloader reference.
 *
 * The visible image retains its own reference to the current image.
 */

function releasePreloader(preloader) {
    if (!preloader) {
        return;
    }

    preloader.onload = null;
    preloader.onerror = null;
    preloader.removeAttribute("src");
}

/*
 * Randomly choose ★, ♥︎, or ◆.
 */

function getRandomNewImageSymbol() {
    return NEW_IMAGE_SYMBOLS[
        Math.floor(
            Math.random() * NEW_IMAGE_SYMBOLS.length
        )
    ];
}

/*
 * Show the animated NEW! indicator.
 */

function showNewIndicator(viewedCount) {
    const indicator = document.getElementById(
        "new-indicator"
    );

    const symbol = document.getElementById(
        "new-symbol"
    );

    const count = document.getElementById(
        "viewed-count"
    );

    const goal = document.getElementById(
        "image-goal"
    );

    clearTimeout(countAnimationTimeout);

    symbol.textContent = getRandomNewImageSymbol();

    goal.textContent = TOTAL_IMAGE_GOAL;

    count.textContent = Math.max(
        viewedCount - 1,
        0
    );

    indicator.classList.remove("show");
    count.classList.remove("increment");

    /*
     * Force both animations to restart.
     */

    void indicator.offsetWidth;

    indicator.setAttribute(
        "aria-hidden",
        "false"
    );

    indicator.classList.add("show");

    countAnimationTimeout = setTimeout(() => {
        count.textContent = viewedCount;
        count.classList.add("increment");
    }, 220);
}

document.getElementById("new-indicator").addEventListener(
    "animationend",
    function (event) {
        if (event.target !== this) {
            return;
        }

        this.classList.remove("show");

        this.setAttribute(
            "aria-hidden",
            "true"
        );
    }
);

/*
 * Record a successfully displayed image.
 */

function recordDisplayedImage(imageId) {
    rememberRecentImage(imageId);

    const viewingResult = rememberViewedImage(
        imageId
    );

    if (viewingResult.isNew) {
        showNewIndicator(
            viewingResult.viewedCount
        );
    }
}

/*
 * Display the first image when the page opens.
 */

async function displayInitialImage() {
    const img = document.getElementById(
        "random-image"
    );

    const imageId = chooseRandomImageId();
    const filename = imageMap[imageId];
    const source = IMAGE_DIRECTORY + filename;

    let preloader = null;

    transitionInProgress = true;

    img.classList.add("is-transitioning");

    try {
        preloader = await preloadImage(source);

        await applyPreloadedImage(
            img,
            preloader
        );

        recordDisplayedImage(imageId);

        const incomingAnimation = reducedMotionEnabled()
            ? "fade-in"
            : "slide-in";

        const incomingDuration = reducedMotionEnabled()
            ? 350
            : 550;

        await playImageAnimation(
            img,
            incomingAnimation,
            incomingDuration
        );

    } finally {
        releasePreloader(preloader);

        img.classList.remove("is-transitioning");

        transitionInProgress = false;
    }
}

/*
 * Replace the current image without reloading the page.
 */

async function displayNextImage() {
    if (transitionInProgress) {
        return;
    }

    const img = document.getElementById(
        "random-image"
    );

    const imageId = chooseRandomImageId();
    const filename = imageMap[imageId];
    const source = IMAGE_DIRECTORY + filename;

    let preloader = null;

    transitionInProgress = true;

    img.classList.add("is-transitioning");

    try {
        const useReducedMotion = reducedMotionEnabled();

        /*
         * Begin transitioning the background immediately,
         * unless reduced motion is enabled.
         */

        if (!useReducedMotion) {
            setRandomBackground(true);
        }

        /*
         * Move or fade the current image off-screen first.
         */

        const outgoingAnimation = useReducedMotion
            ? "fade-out"
            : "slide-out";

        const outgoingDuration = useReducedMotion
            ? 350
            : 450;

        await playImageAnimation(
            img,
            outgoingAnimation,
            outgoingDuration
        );

        /*
         * Load the next image after the current image
         * has finished moving off-screen.
         */

        preloader = await preloadImage(source);

        /*
         * Replace the previous image once its replacement
         * has finished loading.
         */

        img.removeAttribute("src");

        await applyPreloadedImage(
            img,
            preloader
        );

        recordDisplayedImage(imageId);

        /*
         * Move or fade the new image onto the screen.
         */

        const incomingAnimation = useReducedMotion
            ? "fade-in"
            : "slide-in";

        const incomingDuration = useReducedMotion
            ? 350
            : 550;

        await playImageAnimation(
            img,
            incomingAnimation,
            incomingDuration
        );

    } catch (error) {
        console.error(error);

        /*
         * If the next image fails to load, removing the
         * animation class restores the previous image.
         */

        clearImageAnimationClasses(img);

    } finally {
        releasePreloader(preloader);

        img.classList.remove("is-transitioning");

        transitionInProgress = false;
    }
}

/*
 * Load images.json once when the page opens.
 */

async function initializePage() {
    /*
     * The initial random background is assigned on every complete
     * page load, including in reduced-motion mode.
     */

    setRandomBackground(false);

    try {
        const response = await fetch("images.json");

        if (!response.ok) {
            throw new Error(
                `Could not load images.json: ${response.status}`
            );
        }

        imageMap = await response.json();

        if (
            imageMap === null ||
            typeof imageMap !== "object" ||
            Array.isArray(imageMap)
        ) {
            throw new Error(
                "images.json must map numerical IDs to filenames."
            );
        }

        availableImageIds = getAvailableImageIds(
            imageMap
        );

        if (availableImageIds.length === 0) {
            throw new Error(
                "images.json does not contain any valid image IDs."
            );
        }

        await displayInitialImage();

    } catch (error) {
        console.error(error);
    }
}

/*
 * Request another image without reloading the page.
 */

document.getElementById("random-image").addEventListener(
    "click",
    displayNextImage
);

/*
 * Clear both saved image histories after confirmation.
 */

function clearAllSavedImageHistory() {
    const confirmed = window.confirm(
        "Are you sure you want to clear all saved image history?"
    );

    if (!confirmed) {
        return;
    }

    try {
        localStorage.removeItem(
            RECENT_IMAGES_KEY
        );

        localStorage.removeItem(
            VIEWED_IMAGES_KEY
        );

        window.alert(
            "All saved image history has been cleared."
        );

    } catch (error) {
        console.error(
            "Could not clear the saved image history:",
            error
        );

        window.alert(
            "The saved image history could not be cleared."
        );
    }
}

/*
 * Press Delete to clear both saved image histories on desktop.
 */

document.addEventListener("keydown", event => {
    if (
        event.key !== "Delete" ||
        event.repeat
    ) {
        return;
    }

    clearAllSavedImageHistory();
});

/*
 * Provide the same clearing control on mobile and touch devices.
 */

document.getElementById("clear-all-button").addEventListener(
    "click",
    clearAllSavedImageHistory
);

initializePage();

</script>

</body>
</html>
