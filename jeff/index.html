<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jefferson</title>

<style>

html, body {
    margin: 0;
    height: 100%;
    background: #E6D79E;
    display: flex;
    justify-content: center;
    align-items: center;
}

#random-image {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
    cursor: pointer;
    opacity: 0;
}

.fade-in {
    animation: fadeIn 0.35s forwards;
}

.fade-out {
    animation: fadeOut 0.35s forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes fadeOut {
    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }
}

#gallery-button {
    position: fixed;
    bottom: 2vh;
    left: 2vw;
    font-size: clamp(12px, 1.5vw, 18px);
    padding: 1vh 2vw;
    border: none;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    cursor: pointer;
}

#gallery-button:hover {
    background: rgba(0, 0, 0, 0.9);
}

/*
 * Animated indicator for newly discovered images.
 */

#new-indicator {
    position: fixed;
    top: 2vh;
    right: 2vw;
    z-index: 1000;

    display: grid;
    grid-template-columns: auto auto;
    column-gap: 8px;
    row-gap: 2px;
    align-items: center;

    padding: 10px 18px;
    border-radius: 18px;

    background: linear-gradient(
        135deg,
        #ffe680,
        #e6bc45
    );

    color: #272112;
    font-family: Arial, sans-serif;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);

    opacity: 0;
    pointer-events: none;
    user-select: none;
}

#new-symbol {
    grid-column: 1;
    grid-row: 1;

    font-size: clamp(16px, 2vw, 22px);
    line-height: 1;
}

#new-label {
    grid-column: 2;
    grid-row: 1;

    font-size: clamp(14px, 2vw, 20px);
    font-weight: bold;
    letter-spacing: 1px;
    line-height: 1;
}

#new-counter {
    grid-column: 2;
    grid-row: 2;

    font-size: clamp(10px, 1.2vw, 13px);
    font-weight: normal;
    letter-spacing: 0.3px;
    text-align: center;

    opacity: 0.8;
}

#viewed-count {
    display: inline-block;
}

#new-indicator.show {
    animation: newIndicator 2.1s ease forwards;
}

#viewed-count.increment {
    animation: countIncrement 0.5s ease-out forwards;
}

@keyframes newIndicator {
    0% {
        opacity: 0;
        transform: translateY(-12px) scale(0.8);
    }

    15% {
        opacity: 1;
        transform: translateY(0) scale(1.08);
    }

    25% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    78% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    100% {
        opacity: 0;
        transform: translateY(-8px) scale(0.95);
    }
}

@keyframes countIncrement {
    0% {
        opacity: 0;
        transform: translateY(7px) scale(0.85);
    }

    55% {
        opacity: 1;
        transform: translateY(-2px) scale(1.18);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

</style>
</head>

<body>

<img id="random-image" alt="Random image">

<div id="new-indicator" aria-hidden="true">
    <span id="new-symbol">☆</span>

    <span id="new-label">NEW!</span>

    <span id="new-counter">
        <span id="viewed-count">0</span>
        /
        <span id="image-goal">100</span>
    </span>
</div>

<button id="gallery-button" onclick="location.href='/gallery'">
    Gallery
</button>

<script>

const RECENT_IMAGE_LIMIT = 5;
const TOTAL_IMAGE_GOAL = 100;

const RECENT_IMAGES_KEY = "recentImages";
const VIEWED_IMAGES_KEY = "viewedImages";

const NEW_IMAGE_SYMBOLS = [
    "☆",
    "★",
    "♡",
    "♥︎",
    "◇",
    "◆"
];

let countAnimationTimeout = null;

/*
 * Retrieve a saved array from localStorage.
 */

function getStoredImages(key) {
    try {
        const savedImages = localStorage.getItem(key);

        if (!savedImages) {
            return [];
        }

        const parsedImages = JSON.parse(savedImages);

        if (!Array.isArray(parsedImages)) {
            return [];
        }

        return parsedImages.filter(
            image => typeof image === "string"
        );

    } catch (error) {
        console.warn(
            `Could not retrieve "${key}" from localStorage:`,
            error
        );

        return [];
    }
}

/*
 * Retrieve the five most recently displayed images.
 */

function getRecentImages() {
    return getStoredImages(RECENT_IMAGES_KEY).slice(
        -RECENT_IMAGE_LIMIT
    );
}

/*
 * Retrieve every unique image the user has viewed.
 */

function getViewedImages() {
    return [
        ...new Set(
            getStoredImages(VIEWED_IMAGES_KEY)
        )
    ];
}

/*
 * Add an image to the five-image recent history.
 */

function rememberRecentImage(image) {
    try {
        let recentImages = getRecentImages();

        recentImages = recentImages.filter(
            savedImage => savedImage !== image
        );

        recentImages.push(image);

        recentImages = recentImages.slice(
            -RECENT_IMAGE_LIMIT
        );

        localStorage.setItem(
            RECENT_IMAGES_KEY,
            JSON.stringify(recentImages)
        );

    } catch (error) {
        console.warn(
            "Could not save the recent image history:",
            error
        );
    }
}

/*
 * Add an image to the complete viewing history only if it
 * has not previously been viewed.
 */

function rememberViewedImage(image) {
    const viewedImages = getViewedImages();

    if (viewedImages.includes(image)) {
        return {
            isNew: false,
            viewedCount: viewedImages.length
        };
    }

    viewedImages.push(image);

    try {
        localStorage.setItem(
            VIEWED_IMAGES_KEY,
            JSON.stringify(viewedImages)
        );

    } catch (error) {
        console.warn(
            "Could not save the complete viewing history:",
            error
        );
    }

    return {
        isNew: true,
        viewedCount: viewedImages.length
    };
}

/*
 * Select a random symbol for the NEW! indicator.
 */

function getRandomNewImageSymbol() {
    return NEW_IMAGE_SYMBOLS[
        Math.floor(
            Math.random() * NEW_IMAGE_SYMBOLS.length
        )
    ];
}

/*
 * Display the indicator and animate the counter increasing
 * from the previous total to the new total.
 */

function showNewIndicator(viewedCount) {
    const indicator = document.getElementById(
        "new-indicator"
    );

    const symbol = document.getElementById(
        "new-symbol"
    );

    const count = document.getElementById(
        "viewed-count"
    );

    const goal = document.getElementById(
        "image-goal"
    );

    clearTimeout(countAnimationTimeout);

    symbol.textContent = getRandomNewImageSymbol();

    goal.textContent = TOTAL_IMAGE_GOAL;

    /*
     * Start by displaying the previous number.
     */
    count.textContent = Math.max(
        viewedCount - 1,
        0
    );

    indicator.classList.remove("show");
    count.classList.remove("increment");

    /*
     * Restart animations if the indicator was already visible.
     */
    void indicator.offsetWidth;

    indicator.classList.add("show");

    /*
     * Briefly show the previous count, then animate the new count.
     */
    countAnimationTimeout = setTimeout(() => {
        count.textContent = viewedCount;
        count.classList.add("increment");
    }, 220);
}

/*
 * Remove the popup animation class after its animation finishes.
 *
 * Ignore animation events from the counter so the popup does not
 * disappear when the number animation ends.
 */

document.getElementById("new-indicator").addEventListener(
    "animationend",
    function (event) {
        if (event.target !== this) {
            return;
        }

        this.classList.remove("show");
    }
);

/*
 * Load a random image that was not displayed recently.
 */

async function loadImage() {
    const img = document.getElementById(
        "random-image"
    );

    try {
        const response = await fetch("images.json");

        if (!response.ok) {
            throw new Error(
                `Could not load images.json: ${response.status}`
            );
        }

        const files = await response.json();

        if (!Array.isArray(files)) {
            throw new Error(
                "images.json must contain an array of filenames."
            );
        }

        const images = [
            ...new Set(
                files.map(
                    file => "images/" + file
                )
            )
        ];

        if (images.length === 0) {
            throw new Error(
                "images.json does not contain any images."
            );
        }

        let recentImages = getRecentImages().filter(
            image => images.includes(image)
        );

        /*
         * Leave at least one image available, even when the site
         * contains five or fewer images.
         */
        const maximumExclusions = Math.min(
            RECENT_IMAGE_LIMIT,
            Math.max(images.length - 1, 0)
        );

        if (maximumExclusions > 0) {
            recentImages = recentImages.slice(
                -maximumExclusions
            );
        } else {
            recentImages = [];
        }

        const availableImages = images.filter(
            image => !recentImages.includes(image)
        );

        const chosenImage = availableImages[
            Math.floor(
                Math.random() * availableImages.length
            )
        ];

        img.classList.remove(
            "fade-in",
            "fade-out"
        );

        img.onload = () => {
            rememberRecentImage(chosenImage);

            const viewingResult = rememberViewedImage(
                chosenImage
            );

            img.classList.add("fade-in");

            if (viewingResult.isNew) {
                showNewIndicator(
                    viewingResult.viewedCount
                );
            }
        };

        img.onerror = () => {
            console.error(
                "The selected image could not be loaded:",
                chosenImage
            );
        };

        img.src = chosenImage;

    } catch (error) {
        console.error(error);
    }
}

/*
 * Fade out the current image, then reload the page.
 */

document.getElementById("random-image").addEventListener(
    "click",
    function () {
        this.style.pointerEvents = "none";

        this.classList.remove("fade-in");
        this.classList.add("fade-out");

        setTimeout(() => {
            location.reload();
        }, 350);
    }
);

/*
 * Debugging shortcut: press Delete to clear both saved histories.
 */

document.addEventListener("keydown", event => {
    if (event.key !== "Delete" || event.repeat) {
        return;
    }

    const confirmed = window.confirm(
        "Are you sure you want to clear all saved image history?"
    );

    if (!confirmed) {
        return;
    }

    try {
        localStorage.removeItem(RECENT_IMAGES_KEY);
        localStorage.removeItem(VIEWED_IMAGES_KEY);

        window.alert(
            "All saved image history has been cleared."
        );

    } catch (error) {
        console.error(
            "Could not clear the saved image history:",
            error
        );

        window.alert(
            "The saved image history could not be cleared."
        );
    }
});

loadImage();

</script>

</body>
</html>
