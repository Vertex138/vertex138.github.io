<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404</title>

  <script>
    const path = location.pathname;

    if (
      (path === "/jeff" || path.startsWith("/jeff/")) &&
      path !== "/jeff/404.html"
    ) {
      location.replace("/jeff/404.html");
    }
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: white;
    }

    .text {
      font: bold 20vw/1 Geneva, Verdana, sans-serif;
      user-select: none;
    }
  </style>
</head>
<body>
  <main class="text">404</main>
</body>
</html>
