name: Update Jeff's mood

on:
  schedule:
    - cron: "30 4 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

env:
  MOOD_FILE: jeff/mood/today.txt

concurrency:
  group: update-jeffs-mood
  cancel-in-progress: false

jobs:
  update-mood:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.JEFF_MOOD_TOKEN }}

      - name: Choose today's mood
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from os import environ
          from secrets import choice

          mood = choice(range(5, 101, 5))
          Path(environ["MOOD_FILE"]).write_text(f"{mood}\n", encoding="utf-8")
          print(f"Today's mood is {mood}%")
          PY

      - name: Save today's mood
        shell: bash
        run: |
          if git diff --quiet -- "$MOOD_FILE"; then
            echo "Jeff rolled the same mood as yesterday."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MOOD_FILE"
          git commit -m "Update Jeff's daily mood"
          git push
