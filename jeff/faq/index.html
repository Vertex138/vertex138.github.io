<!doctype html>
<html lang="en" style="display: none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Runs immediately so locked visitors are redirected before the page loads. -->
    <script src="/jeff/faq/faq.js"></script>

    <title>Jeff's FAQ</title>

    <link rel="icon" href="/jeff/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/jeff/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/jeff/icons/apple-touch-icon.png" />

    <link
      rel="preload"
      href="/jeff/fonts/MatchaMint.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/jeff/fonts/SuperBouncer.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="/jeff/menu/site-menu.css" />
    <link rel="stylesheet" href="/jeff/faq/faq.css" />

    <script src="/jeff/menu/site-menu.js" defer></script>
  </head>

  <body>
    <main id="faq-page">
      <header id="faq-header">
        <h1>Jeff's FAQ</h1>
        <p id="faq-subtitle" aria-live="polite">What do you want to ask about?</p>
      </header>

      <div id="faq-content" aria-busy="true">
        <p id="faq-status" role="status" aria-live="polite">Loading FAQ…</p>
        <section id="faq-categories" aria-label="FAQ categories" hidden>
          <div id="faq-category-buttons"></div>
        </section>

        <section id="faq-questions-view" aria-label="Frequently asked questions" hidden>
          <button id="faq-back" class="faq-control-button" type="button">
            Ask about something else
          </button>
          <div id="faq-list"></div>
          <img id="faq-image" src="/jeff/faq/faqimage.png" alt="" draggable="false" hidden />
        </section>
      </div>
    </main>
  </body>
</html>
