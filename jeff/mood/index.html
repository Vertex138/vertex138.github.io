<!doctype html>
<html lang="en" style="display: none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Runs immediately so locked visitors are redirected before the page is displayed. -->
    <script src="/jeff/mood/mood.js"></script>

    <title>Jeff's Mood</title>

    <link rel="icon" href="/jeff/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/jeff/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/jeff/icons/apple-touch-icon.png" />

    <link
      rel="preload"
      href="/jeff/fonts/MatchaMint.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/jeff/fonts/SuperBouncer.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="/jeff/menu/site-menu.css" />
    <link rel="stylesheet" href="/jeff/mood/mood.css" />

    <script src="/jeff/menu/site-menu.js" defer></script>
  </head>

  <body>
    <main id="mood-page" aria-busy="true">
      <div id="mood-overview">
        <header id="mood-header">
          <h1>Jeff's Mood</h1>
          <p>How's Jeff feeling right now?</p>
        </header>

        <section id="mood-summary" aria-label="Jeff's current mood">
          <div id="mood-meter" role="img" aria-label="Loading Jeff's current mood">
            <svg viewBox="0 0 240 170" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <path
                class="mood-meter-track"
                d="M 29.369 157.262 A 100 100 0 1 1 210.631 157.262"
                pathLength="100"
              />
              <path
                id="mood-meter-outline"
                d="M 29.369 157.262 A 100 100 0 1 1 210.631 157.262"
                pathLength="100"
              />
              <path
                id="mood-meter-fill"
                d="M 29.369 157.262 A 100 100 0 1 1 210.631 157.262"
                pathLength="100"
              />
              <text id="mood-value" x="120" y="115" text-anchor="middle" dominant-baseline="middle">
                --%
              </text>
            </svg>
          </div>

          <p id="mood-timestamp" hidden></p>
        </section>
      </div>

      <figure id="mood-figure" hidden>
        <div id="mood-image-stage">
          <img id="mood-image" alt="" draggable="false" />
        </div>
        <figcaption id="mood-caption"></figcaption>
      </figure>
    </main>

    <div id="new-indicator" aria-hidden="true">
      <span id="new-symbol">★</span>
      <span id="new-label">NEW!</span>
      <span id="new-counter">
        <span id="viewed-count">0</span>
        /
        <span id="image-goal">150</span>
      </span>
    </div>

    <div
      id="collection-complete-star"
      role="img"
      aria-label="You've completed Jeff's gallery"
      title="You've completed Jeff's gallery"
      hidden
    >
      ★
    </div>

    <div
      id="collection-complete-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="collection-complete-title"
      hidden
    >
      <div id="collection-complete-card">
        <div id="collection-complete-symbol" aria-hidden="true">★</div>
        <h2 id="collection-complete-title">You've Completed Jeff's Gallery!</h2>
        <button id="collection-continue-button" type="button">Meow!</button>
      </div>
    </div>

    <div id="mood-error-overlay" role="alert" aria-live="assertive" hidden>
      <div id="mood-error-content">
        <p>Oops! Something went wrong. Maybe Jeff is feeling shy today?</p>
        <button id="mood-retry-button" type="button">RETRY</button>
      </div>
    </div>
  </body>
</html>
